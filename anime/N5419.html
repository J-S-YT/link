<!DOCTYPE html>

            align-items: center;

            min-height: 100vh;

        .container {

        .anuncio a {

            text-decoration: underline;

            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);

        button:hover {
